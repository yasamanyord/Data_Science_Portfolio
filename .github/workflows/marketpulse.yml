name: MarketPulse ML checks
on:
  push:
    paths:
      - 'Project_2_Stock_Prediction_DL/**'
      - '.github/workflows/marketpulse.yml'
  pull_request:
    paths:
      - 'Project_2_Stock_Prediction_DL/**'
      - '.github/workflows/marketpulse.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: Project_2_Stock_Prediction_DL
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-data.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m marketpulse demo --output runs/reproduction
      - run: python -m marketpulse compare --reference artifacts/demo --candidate runs/reproduction
      - run: node --check marketpulse/static/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: verified-offline-evidence
          path: Project_2_Stock_Prediction_DL/runs/reproduction
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m uvicorn marketpulse.api:app --host 127.0.0.1 --port 8000 --no-access-log &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          SCREENSHOT_DIR=runs/screenshots python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: Project_2_Stock_Prediction_DL/runs/screenshots
          if-no-files-found: ignore
  neural:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      CUDA_VISIBLE_DEVICES: '-1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-deep.txt
      - run: python -m unittest discover -s tests -v
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t marketpulse:ci .
      - run: |
          docker run -d --rm --name marketpulse-ci -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp marketpulse:ci
          trap 'docker logs marketpulse-ci || true; docker stop marketpulse-ci || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/forecast
